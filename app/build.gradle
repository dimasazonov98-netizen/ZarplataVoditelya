plugins {
    id 'com.android.application'
}

def appMetricaKey = System.getenv("APPMETRICA_API_KEY") ?: ""

android {
    namespace 'com.dmitry.zarplata'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId 'com.dmitry.zarplata'
        minSdk 24
        targetSdk 34
        buildConfigField "String", "APPMETRICA_API_KEY", '"'+appMetricaKey.replace('\\','\\\\').replace('"','\\\"')+'"'
        versionCode 24
        versionName '1.7.0 Flexible Tariffs'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }

    buildFeatures {
        buildConfig true
    }
}


dependencies {
    implementation 'io.appmetrica.analytics:analytics:8.5.1'
}
