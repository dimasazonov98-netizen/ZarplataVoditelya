plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dmitry.zarplata'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId 'com.dmitry.zarplata'
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName '1.5.5 Stats Scroll'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}
