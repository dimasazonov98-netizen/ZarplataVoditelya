plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dmitry.zarplata'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId 'com.dmitry.zarplata'
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName '1.6.1 AppMetrica'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}


dependencies {
    implementation 'io.appmetrica.analytics:analytics:8.5.1'
}
