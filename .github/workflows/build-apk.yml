name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: zarplata-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Luxe assets
        run: bash scripts/prepare_luxe_assets.sh
      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/app.js
      - name: Verify AppMetrica key
        run: |
          if [ -z "$APPMETRICA_API_KEY" ]; then
            echo "APPMETRICA_API_KEY is not configured"
            exit 1
          fi
          echo "AppMetrica key is configured"
      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zarplata-android-signing-v1
      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Zarplata Voditelya,O=Personal Android App,C=NL"
          fi
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRUK-WALLET-v1.6.4-APPMETRICA-FLUSH-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
