name: DuoBudget v0.3 Android build

on:
  push:
    branches:
      - duobudget-v0.3-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct DuoBudget source archive
        shell: bash
        run: |
          cat \
            duobudget-ci/chunk_00 \
            duobudget-ci/chunk_01 \
            duobudget-ci/chunk_02 \
            duobudget-ci/chunk_03 \
            duobudget-ci/chunk_04 \
            duobudget-ci/chunk_05 \
            duobudget-ci/c6_0 \
            duobudget-ci/c6_1 \
            duobudget-ci/c7_0 \
            duobudget-ci/c7_1 \
            duobudget-ci/chunk_08 \
            > /tmp/duobudget-source.b64
          base64 --decode /tmp/duobudget-source.b64 > /tmp/DuoBudget-v0.3-source.zip
          sha256sum /tmp/DuoBudget-v0.3-source.zip
          mkdir -p /tmp/duobudget-src
          unzip -q /tmp/DuoBudget-v0.3-source.zip -d /tmp/duobudget-src
          test -f /tmp/duobudget-src/DuoBudget/settings.gradle.kts
          cp duobudget-ci/gradle.properties /tmp/duobudget-src/DuoBudget/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint and assemble debug APK
        working-directory: /tmp/duobudget-src/DuoBudget
        env:
          DUOBUDGET_FIREBASE_API_KEY: ''
          DUOBUDGET_FIREBASE_APP_ID: ''
          DUOBUDGET_FIREBASE_PROJECT_ID: ''
        run: gradle --no-daemon lintDebug assembleDebug --stacktrace

      - name: Verify APK signature and checksum
        shell: bash
        run: |
          APK=/tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee /tmp/DuoBudget-v0.3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoBudget-v0.3-debug-apk
          path: |
            /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
            /tmp/DuoBudget-v0.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
