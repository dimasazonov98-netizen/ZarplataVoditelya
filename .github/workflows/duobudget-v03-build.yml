name: DuoBudget v0.3 APK

on:
  push:
    branches:
      - duobudget-build-v03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore DuoBudget source
        shell: bash
        run: |
          set -euo pipefail
          cat .duobudget-build/part-* > /tmp/DuoBudget-v0.3-source.zip
          unzip -t /tmp/DuoBudget-v0.3-source.zip
          rm -rf /tmp/duobudget
          mkdir -p /tmp/duobudget
          unzip -q /tmp/DuoBudget-v0.3-source.zip -d /tmp/duobudget

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p /tmp/duobudget/DuoBudget :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/duobudget/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/duobudget/DuoBudget/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoBudget-v0.3-debug-apk
          path: /tmp/duobudget/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
