name: DuoBudget v0.3 Android build

on:
  push:
    branches:
      - duobudget-v0.3-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct DuoBudget source archive
        shell: bash
        run: |
          cat duobudget-ci/chunk_* > /tmp/duobudget-source.b64
          base64 --decode /tmp/duobudget-source.b64 > /tmp/DuoBudget-v0.3-source.zip
          mkdir -p /tmp/duobudget-src
          unzip -q /tmp/DuoBudget-v0.3-source.zip -d /tmp/duobudget-src
          test -f /tmp/duobudget-src/DuoBudget/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint and assemble debug APK
        working-directory: /tmp/duobudget-src/DuoBudget
        env:
          DUOBUDGET_FIREBASE_API_KEY: ''
          DUOBUDGET_FIREBASE_APP_ID: ''
          DUOBUDGET_FIREBASE_PROJECT_ID: ''
        run: gradle --no-daemon lintDebug assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/DuoBudget-v0.3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoBudget-v0.3-debug-apk
          path: |
            /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
            /tmp/DuoBudget-v0.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
