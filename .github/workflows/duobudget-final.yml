name: DuoBudget final Android verification
on:
  push:
    branches: [duobudget-final-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DUOBUDGET_TEST_KEYSTORE: ${{ github.workspace }}/DuoBudget/.ci/debug.keystore
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create temporary instrumentation signing key outside emulator home
        run: |
          mkdir -p DuoBudget/.ci
          keytool -genkeypair -keystore "$DUOBUDGET_TEST_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Android Debug,O=Tests,C=US" -noprompt
      - name: Install SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Money, backup tests, release lint and APK builds
        working-directory: DuoBudget
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Android UI, encrypted vault and restoration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon -p DuoBudget connectedDebugAndroidTest --stacktrace
            mkdir -p final-out/screens
            adb exec-out cat /sdcard/Download/DuoBudgetQA/01-home.png > final-out/screens/01-home.png
            adb exec-out cat /sdcard/Download/DuoBudgetQA/02-goal.png > final-out/screens/02-goal.png
            adb exec-out cat /sdcard/Download/DuoBudgetQA/03-final-home.png > final-out/screens/03-final-home.png
      - name: Collect unsigned release, signer and validation
        if: always()
        shell: bash
        run: |
          mkdir -p final-out/screens
          if [ -f DuoBudget/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp DuoBudget/app/build/outputs/apk/release/app-release-unsigned.apk final-out/
          fi
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" final-out/
          cp -R DuoBudget/app/build/reports final-out/reports || true
          cp -R DuoBudget/app/build/test-results final-out/test-results || true
          cp -R DuoBudget/app/build/outputs/androidTest-results final-out/androidTest-results || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DuoBudget-v1.0-api-${{ matrix.api }}
          path: final-out/
          retention-days: 7
          if-no-files-found: error

