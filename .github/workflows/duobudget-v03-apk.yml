name: DuoBudget v0.3 APK

on:
  push:
    branches: [duobudget-apk-v03-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify and extract source
        shell: bash
        run: |
          unzip -t duobudget-build/source.zip
          mkdir -p /tmp/duobudget-src
          unzip -q duobudget-build/source.zip -d /tmp/duobudget-src
      - name: Build debug APK
        working-directory: /tmp/duobudget-src/DuoBudget
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK exists
        shell: bash
        run: |
          test -s /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoBudget-v0.3-debug-apk
          path: /tmp/duobudget-src/DuoBudget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
